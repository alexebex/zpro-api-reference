  /v2/api/external/{apiId}/createContact:
    post:
      tags:
      - 👤 Contatos
      summary: CreateContact
      operationId: CreateContact
      description: 'Endereço opcional: cep (até 20 caracteres), logradouro, numeroEndereco, complemento,
        bairro e cidade (até 255 cada) e estado (até 100). Textos aparados e cortados no limite, sem erro;
        o estado é gravado como veio. A resposta traz o contato criado com os 7 campos de endereço (cep,
        logradouro, numeroEndereco, complemento, bairro, cidade, estado).'
      parameters:
      - $ref: '#/components/parameters/ApiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome completo do contato
                  example: Nome
                number:
                  type: string
                  description: 'Número do WhatsApp (formato: 5511999999999)'
                  example: '5515998566622'
                email:
                  type: string
                  description: Email do contato
                  example: contato@email.com
                cpf:
                  type: string
                  description: 'CPF do contato (formato: 000.000.000-00)'
                  example: 012.345.678.91
                firstName:
                  type: string
                  description: Primeiro nome do contato
                  example: Nome Principal
                lastName:
                  type: string
                  description: Sobrenome do contato
                  example: Sobrenome
                businessName:
                  type: string
                  description: Nome da empresa do contato
                  example: Empresa
                birthdayDate:
                  type: string
                  description: 'Data de nascimento (formato: DD/MM/AAAA)'
                  example: 01/01/1990
                cep:
                  type: string
                  description: Endereço (opcional). Textos aparados; o que passar do limite é cortado,
                    sem erro CEP (até 20 caracteres)
                  example: 01310-100
                logradouro:
                  type: string
                  description: Rua (até 255 caracteres)
                  example: Avenida Paulista
                numeroEndereco:
                  type: string
                  description: Número do endereço (até 255 caracteres)
                  example: '1000'
                complemento:
                  type: string
                  description: Complemento (até 255 caracteres)
                  example: Sala 101
                bairro:
                  type: string
                  description: Bairro (até 255 caracteres)
                  example: Bela Vista
                cidade:
                  type: string
                  description: Cidade (até 255 caracteres)
                  example: São Paulo
                estado:
                  type: string
                  description: Estado (até 100 caracteres, gravado como veio)
                  example: SP
                externalKey:
                  type: string
                  description: Chave única do sistema para identificação (valor gerado do seu lado para
                    controle do envio e não pode se repetir)
                  example: ID_UNICA_DO_SISTEMA_CLIENTE_PARA_EXECUTAR_UMA_ACAO_COM_WEBHOOK
                validateNumber:
                  type: boolean
                  description: Validar numero (opcional, padrao true). Se false, usa o numero exatamente
                    como enviado, sem normalizacao do 9o digito BR — recomendado p/ WABA evitar ticket
                    duplicado
                  example: true
            example:
              name: Nome
              number: '5515998566622'
              email: contato@email.com
              cpf: 012.345.678.91
              firstName: Nome Principal
              lastName: Sobrenome
              businessName: Empresa
              birthdayDate: 01/01/1990
              cep: 01310-100
              logradouro: Avenida Paulista
              numeroEndereco: '1000'
              complemento: Sala 101
              bairro: Bela Vista
              cidade: São Paulo
              estado: SP
              externalKey: ID_UNICA_DO_SISTEMA_CLIENTE_PARA_EXECUTAR_UMA_ACAO_COM_WEBHOOK
              validateNumber: true
      responses:
        '200':
          description: Requisição processada com sucesso.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Token ausente, inválido ou sem permissão.
        '400':
          description: Parâmetros inválidos ou faltando.
      security:
      - bearerAuth: []
