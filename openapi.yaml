  /v2/api/external/{apiId}/contacts/search:
    post:
      tags:
      - 👤 Contatos
      summary: SearchContacts
      operationId: SearchContacts
      description: 'Filtros de endereço: addressBairro e addressCidade por "contém", sem diferenciar acento
        e maiúsculas; addressUfs com as siglas das 27 UFs em texto separado por vírgula ("SP,RJ") ou em
        lista (["SP", "RJ"]), achando também o estado gravado por extenso ("São Paulo"); UF pedida sem
        nenhuma sigla válida devolve lista vazia. Resposta: { "success": true, "data": [{ "id": 1, "number":
        "5511999999999", "name": "Nome", "email": "contato@email.com", "blocked": false, "cep": "01310-100",
        "logradouro": "Avenida Paulista", "numeroEndereco": "1000", "complemento": "Sala 101", "bairro":
        "Bela Vista", "cidade": "São Paulo", "estado": "SP", "tags": [], "wallets": [] }], "pagination":
        { "page": 1, "limit": 40, "total": 1, "totalPages": 1, "hasMore": false }, "meta": { "addressFilter":
        true } }. meta.addressFilter false indica servidor sem as colunas de endereço: os filtros de endereço
        foram ignorados.'
      parameters:
      - $ref: '#/components/parameters/ApiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                searchParam:
                  type: string
                  description: Parâmetro de busca textual (opcional) - busca em nome, número, CPF, etc
                page:
                  type: integer
                  description: 'Número da página (padrão: 1)'
                  example: 1
                limit:
                  type: integer
                  description: 'Limite de resultados por página (padrão: 40)'
                  example: 40
                tagId:
                  type: integer
                  description: ID de uma tag para filtrar (opcional)
                  example: 1
            example:
              searchParam: ''
              page: 1
              limit: 40
              tagId: 1
      responses:
        '200':
          description: Requisição processada com sucesso.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Token ausente, inválido ou sem permissão.
        '400':
          description: Parâmetros inválidos ou faltando.
      security:
      - bearerAuth: []
