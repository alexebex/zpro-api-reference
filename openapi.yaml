  /v2/api/external/{apiId}/sendMessageByTicket:
    post:
      tags:
      - 🎯 Envio por Ticket
      summary: SendMessageByTicket
      operationId: SendMessageByTicketText
      parameters:
      - $ref: '#/components/parameters/ApiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticketId:
                  type: integer
                  description: ID do ticket (conversa) que recebera a mensagem
                  example: 1262
                body:
                  type: string
                  description: Texto da mensagem (obrigatorio quando nao ha midia)
                  example: Ola! Como posso ajudar?
                externalKey:
                  type: string
                  description: Chave unica p/ idempotencia (recomendado)
                  example: chave-001
                reopen:
                  type: boolean
                  description: Reabrir ticket fechado antes de enviar (sem isto, ticket fechado retorna
                    409)
                  example: false
                isClosed:
                  type: boolean
                  description: Fechar o ticket apos o envio
                  example: false
              required:
              - body
            examples:
              SendMessageByTicket:
                summary: SendMessageByTicket
                value:
                  ticketId: 1262
                  body: Ola! Como posso ajudar?
                  externalKey: chave-001
                  reopen: false
                  isClosed: false
              SendMessageByTicketMediaUrl:
                summary: SendMessageByTicketMediaUrl
                value:
                  ticketId: 1262
                  mediaUrl: https://exemplo.com/imagem.png
                  body: Legenda opcional
                  externalKey: chave-001
              SendMessageByTicketBase64:
                summary: SendMessageByTicketBase64
                value:
                  ticketId: 1262
                  body: Legenda opcional
                  base64Data: iVBORw0KGgoAAAANSUhEUgAAAAUA...
                  mimeType: image/png
                  fileName: exemplo
                  externalKey: chave-001
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                ticketId:
                  type: string
                  example: '1262'
                body:
                  type: string
                  example: Legenda opcional
                externalKey:
                  type: string
                  example: chave-001
                reopen:
                  type: string
                  example: 'false'
                isClosed:
                  type: string
                  example: 'false'
              required:
              - media
      responses:
        '200':
          description: Requisição processada com sucesso.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Token ausente, inválido ou sem permissão.
        '400':
          description: Parâmetros inválidos ou faltando.
      security:
      - bearerAuth: []
      x-variantes:
      - SendMessageByTicketText
      - SendMessageByTicketFile
      - SendMessageByTicketMediaUrl
      - SendMessageByTicketBase64
      description: 'Endpoint com mais de um formato de payload na coleção oficial: **SendMessageByTicketText**,
        **SendMessageByTicketFile**, **SendMessageByTicketMediaUrl**, **SendMessageByTicketBase64**. Veja
        os exemplos do corpo para escolher a variante.'
