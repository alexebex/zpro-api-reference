    post:
      tags:
      - 🏢 Tenant API
      summary: StoreTenant
      operationId: StoreTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: Status do tenant (active, inactive)
                  example: active
                name:
                  type: string
                  description: Nome da empresa/tenant
                  example: Empresa Exemplo
                maxUsers:
                  type: integer
                  description: Número máximo de usuários permitidos
                  example: 3
                maxConnections:
                  type: integer
                  description: Número máximo de conexões WhatsApp permitidas
                  example: 3
                acceptTerms:
                  type: boolean
                  description: Confirmação de aceite dos termos
                  example: true
                email:
                  type: string
                  description: Email do administrador do tenant
                  example: user@example.com
                password:
                  type: string
                  description: Senha do administrador (mínimo 8 caracteres, incluindo números e caracteres
                    especiais)
                  example: securePassword123!
                userName:
                  type: string
                  description: Nome completo do administrador
                  example: Pedro Bastos
                profile:
                  type: string
                  description: Perfil do administrador (admin, user)
                  example: admin
                planId:
                  type: integer
                  description: Plano do tenant (OPCIONAL). ID do plano cadastrado em Planos. Aplica na
                    criação os limites e recursos do plano (usuários, conexões, canais), que prevalecem
                    sobre maxUsers/maxConnections informados acima. ID inexistente devolve erro 400 e
                    nada é criado. Sem este campo, o tenant nasce sem plano (comportamento anterior).
                  example: 1
                paymentGateway:
                  type: string
                  description: 'Vinculo de gateway de pagamento (OPCIONAL). Define qual gateway o webhook
                    usa para atualizar o status de pagamento do tenant automaticamente. Valores: asaas,
                    stripe, pagarme, mercadopago.'
                  example: stripe
                stripeCustomerId:
                  type: string
                  description: 'Credenciais do gateway informado acima (envie apenas o par do gateway
                    escolhido). Exemplo Stripe: Customer ID + Secret Key.'
                  example: cus_XXXXXXXXXXXXXX
                stripeToken:
                  type: string
                  example: sk_live_XXXXXXXXXXXXXXXX
            example:
              status: active
              name: Empresa Exemplo
              maxUsers: 3
              maxConnections: 3
              acceptTerms: true
              email: user@example.com
              password: securePassword123!
              userName: Pedro Bastos
              profile: admin
              planId: 1
              paymentGateway: stripe
              stripeCustomerId: cus_XXXXXXXXXXXXXX
              stripeToken: sk_live_XXXXXXXXXXXXXXXX
      responses:
        '200':
          description: Requisição processada com sucesso.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Token ausente, inválido ou sem permissão.
        '400':
          description: Parâmetros inválidos ou faltando.
      security:
      - superAdminAuth: []
  /tenantApiUpdateTenant:
    post:
      tags:
      - 🏢 Tenant API
      summary: UpdateTenant
      operationId: UpdateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: string
                  description: Identidade do tenant (CPF/CNPJ) - identificador usado para reconhecer qual
                    tenant será atualizado
                  example: 07122989674
                status:
                  type: string
                  description: Status do tenant (active, inactive)
                  example: active
                maxUsers:
                  type: integer
                  description: Número máximo de usuários permitidos
                  example: 100
                maxConnections:
                  type: integer
                  description: Número máximo de conexões permitidas
                  example: 10
                paymentGateway:
                  type: string
                  description: Gateway de pagamento (none, asaas, mercadopago, stripe, pagarme)
                  example: asaas
                supportChatEnabled:
                  type: string
                  description: 'Credenciais do gateway (OPCIONAL) — envie o par correspondente ao paymentGateway.
                    Ao trocar para um gateway nao-Asaas, o modo Asaas legado e desligado automaticamente.
                    Stripe:       "stripeCustomerId": "cus_xxx",      "stripeToken": "sk_live_xxx" Pagar.me:     "pagarmeCustomerId":
                    "cus_xxx",     "pagarmeToken": "sk_xxx" Mercado Pago: "mercadopagoCustomerId": "123456",  "mercadopagoToken":
                    "APP_USR-xxx" Chat de suporte habilitado (enabled, disabled)'
                  example: enabled
                menuVisibility:
                  type: array
                  description: 'Menus visíveis — array de strings com os menus habilitados Opções: Groups,
                    MassDispatch, Kanban, Tasks, Api, ChatBot, Reports, Campaigns, PrivateChat, Teams,
                    AllowedChannels'
                  items:
                    type: string
                    example: Groups
                allowedChannels:
                  type: array
                  description: 'Canais permitidos — array de strings com os canais habilitados Opções:
                    waba, baileys, whatsapp, meow, evo, evogo, zapi, uazapi, zapo, telegram, hub, webchat,
                    mercadolivre, olx, linkedin, youtube, tiktok, woocommerce, nuvemshop, webmail, email,
                    waba_oauth, dialog360, gupshup, instagram_oauth, facebook_oauth WhatsApp Oficial via
                    login = waba_oauth, Instagram Oficial = instagram_oauth, Facebook Oficial = facebook_oauth'
                  items:
                    type: string
                    example: waba
                channelConnectionLimits:
                  type: object
                  description: Limite máximo de conexões por tipo de canal. Use 0 para ilimitado. waba
                    e waba_oauth valem para o mesmo tipo real (a chave waba vence quando presente); hub
                    cobre todos os canais do Hub
                  properties:
                    waba:
                      type: integer
                      example: 0
                    waba_oauth:
                      type: integer
                      example: 0
                    instagram_oauth:
                      type: integer
                      example: 0
                    facebook_oauth:
                      type: integer
                      example: 0
                    hub:
                      type: integer
                      example: 0
                    baileys:
                      type: integer
                      example: 0
                    zapo:
                      type: integer
                      example: 0
                    telegram:
                      type: integer
                      example: 0
                    webchat:
                      type: integer
                      example: 0
                    webmail:
                      type: integer
                      example: 0
                oauthEnabled:
                  type: boolean
                  description: OAuth (Meta Embedded Signup) OAuth habilitado (true/false)
                  example: false
                oauthProxyUrl:
                  type: string
                  description: URL do Proxy OAuth
                  example: https://proxy.exemplo.com/oauth
                instagramWebhookProxyUrl:
                  type: string
                  description: URL do Proxy de Webhook Instagram
                  example: https://proxy.exemplo.com/instagram/webhook
                instagramWebhookProxySecret:
                  type: string
                  description: Segredo do Proxy Instagram
                  example: secret_instagram
                messengerWebhookProxyUrl:
                  type: string
                  description: URL do Proxy de Webhook Messenger
                  example: https://proxy.exemplo.com/messenger/webhook
                messengerWebhookProxySecret:
                  type: string
                  description: Segredo do Proxy Messenger
                  example: secret_messenger
            example:
              identity: 07122989674
              status: active
              maxUsers: 100
              maxConnections: 10
              paymentGateway: asaas
              supportChatEnabled: enabled
              menuVisibility:
              - Groups
              - MassDispatch
              - Kanban
              - Tasks
              - Api
              - ChatBot
              - Reports
              - Campaigns
              - PrivateChat
              - Teams
              - AllowedChannels
