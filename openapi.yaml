    superAdminAuth:
      type: http
      scheme: bearer
      description: 'Token de super admin, exigido pelas rotas de Tenant API (na coleção Postman: `SuperAdminToken`).'
  parameters:
    ApiId:
      name: apiId
      in: path
      required: true
      description: ID da API externa cadastrada no Z-PRO.
      schema:
        type: string
