      summary: AppointmentList
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          example: '1'
        - name: limit
          in: query
          schema:
            type: integer
          example: '20'
        - name: status
          in: query
          schema:
            type: string
          description: pending | confirmed | cancelled | completed
          example: pending
        - name: startFrom
          in: query
          schema:
            type: number
          description: Filtrar agendamentos a partir desta data (ISO 8601)
          example: '2026-04-01T00:00:00.000Z'
        - name: startTo
          in: query
          schema:
            type: number
          description: Filtrar agendamentos até esta data (ISO 8601)
          example: '2026-04-30T23:59:59.000Z'
        - name: search
          in: query
          schema:
            type: string
          description: Busca por título ou nome do contato
