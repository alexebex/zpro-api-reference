                  externalKey: ID_UNICA_DO_SISTEMA_CLIENTE_PARA_EXECUTAR_UMA_ACAO_COM_WEBHOOK
                  userId: 3
                  status: pending
                  name: Nome do Contato
                  firstName: Nome
                  lastName: Sobrenome
                  validateNumber: true
