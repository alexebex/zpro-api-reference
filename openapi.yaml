  /v2/api/external/{apiId}/template:
    post:
      tags:
      - 📋 Templates WABA
      summary: SendTemplateWaba
      operationId: SendTemplateWaba
      description: 'A resposta retorna o ticketId do atendimento criado ou reutilizado. Exemplo: { "success":
        true, "data": { "message": "Message sent successfully", "ticketId": 123 } }'
      parameters:
      - $ref: '#/components/parameters/ApiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: 'Número do WhatsApp do destinatário (formato: 5511999999999)'
                  example: '5515998566622'
                isClosed:
                  type: boolean
                  description: Define se o ticket será fechado após o envio
                  example: false
                templateData:
                  type: object
                  description: Dados do template do WhatsApp Business API
                  properties:
                    messaging_product:
                      type: string
                      description: Produto de mensageria (sempre whatsapp)
                      example: whatsapp
                    to:
                      type: string
                      description: Número do destinatário (mesmo do campo number)
                      example: '5515998566622'
                    type:
                      type: string
                      description: Tipo da mensagem (sempre template)
                      example: template
                    template:
                      type: object
                      description: Configurações do template
                      properties:
                        name:
                          type: string
                          description: Nome do template aprovado
                          example: hello_world
                        language:
                          type: object
                          description: Configurações de idioma
                          properties:
                            code:
                              type: string
                              description: 'Código do idioma (ex: en_US, pt_BR)'
                              example: en_US
                validateNumber:
                  type: boolean
                  description: Validar numero (opcional, padrao true). Se false, usa o numero exatamente
                    como enviado, sem normalizacao do 9o digito BR — recomendado p/ WABA evitar ticket
                    duplicado
                  example: true
            example:
              number: '5515998566622'
              isClosed: false
              templateData:
                messaging_product: whatsapp
                to: '5515998566622'
                type: template
                template:
                  name: hello_world
                  language:
                    code: en_US
              validateNumber: true
      responses:
        '200':
          description: Requisição processada com sucesso.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Token ausente, inválido ou sem permissão.
        '400':
          description: Parâmetros inválidos ou faltando.
      security:
      - bearerAuth: []
