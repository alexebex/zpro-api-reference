name: Converter Postman para OpenAPI

on:
  push:
    paths:
      - 'Postman Collections/zproapi.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # <-- Atualizado para v4 (sem avisos do Node)
      
      - name: Instalar bibliotecas
        run: npm install postman-to-openapi json5 js-yaml
        
      - name: Converter usando script Node.js
        run: |
          node -e "
          const fs = require('fs');
          const p2o = require('postman-to-openapi');
          const JSON5 = require('json5');
          const yaml = require('js-yaml');
          
          try {
            const inputFile = './Postman Collections/zproapi.json';
            const tempFile = './temp_zproapi.json';
            
            const collectionStr = fs.readFileSync(inputFile, 'utf8');
            const collection = JSON.parse(collectionStr);
            
            // 1. O RESGATADOR DE COMENTÁRIOS: Lê os // do Postman antes de converter
            const endpointDescriptions = {};
            
            function extractDescriptions(rawString) {
              const descriptions = {};
              if (!rawString) return descriptions;
              const lines = rawString.split('\n');
              let pendingComment = '';
              
              lines.forEach(line => {
                const tLine = line.trim();
                if (tLine.startsWith('//')) {
                  // Acumula os comentários acima do campo
                  pendingComment += tLine.replace(/^\/\/\s*/, '') + ' ';
                } else {
                  const keyMatch = tLine.match(/^\"([^\"]+)\"\s*:/);
                  if (keyMatch) {
                    const key = keyMatch[1];
                    let desc = pendingComment.trim();
                    
                    // Pega também comentários inline (no final da linha)
                    const inlineIdx = tLine.indexOf('//');
                    if (inlineIdx !== -1 && !tLine.includes('http://') && !tLine.includes('https://')) {
                      const inlineDesc = tLine.substring(inlineIdx + 2).trim();
                      desc = desc ? desc + ' | ' + inlineDesc : inlineDesc;
                    }
                    
                    if (desc) descriptions[key] = desc;
                    pendingComment = ''; // Reseta para o próximo campo
                  } else {
                    pendingComment = '';
                  }
                }
              });
              return descriptions;
            }
            
            function traverseAndExtract(items) {
              if (!items) return;
              for (const item of items) {
                if (item.item) traverseAndExtract(item.item);
                else if (item.request && item.request.body && item.request.body.raw) {
                   endpointDescriptions[item.name] = extractDescriptions(item.request.body.raw);
                }
              }
            }
            traverseAndExtract(collection.item);
            
            // 2. Limpa o JSON com segurança usando JSON5
            function cleanJsonString(str) {
              if (!str || str.trim() === '') return undefined;
              try {
                let cleaned = str.replace(/:\s*(\{\{[^}]+\}\})\s*(,?)/g, ': \'$1\'$2');
                const parsed = JSON5.parse(cleaned);
                return JSON.stringify(parsed, null, 2);
              } catch (e) {
                return '{}';
              }
            }
            
            function forceValidJson(obj) {
              if (!obj || typeof obj !== 'object') return;
              if (obj.body && obj.body.mode === 'raw' && obj.body.options && obj.body.options.raw && obj.body.options.raw.language === 'json') {
                const cleaned = cleanJsonString(obj.body.raw);
                if (cleaned) obj.body.raw = cleaned;
              }
              if (obj._postman_previewlanguage === 'json' && typeof obj.body === 'string') {
                const cleaned = cleanJsonString(obj.body);
                if (cleaned) obj.body = cleaned;
              }
              Object.values(obj).forEach(forceValidJson);
            }
            
            forceValidJson(collection);
            fs.writeFileSync(tempFile, JSON.stringify(collection));
            
            // 3. Converte para YAML e INJETA OS COMENTÁRIOS DE VOLTA
            p2o(tempFile, './openapi.yaml')
              .then(() => {
                const openapiStr = fs.readFileSync('./openapi.yaml', 'utf8');
                const openapi = yaml.load(openapiStr);
                
                function inferSchema(example, descMap) {
                  if (example === null) return { type: 'string', nullable: true };
                  if (Array.isArray(example)) {
                    return { type: 'array', items: example.length > 0 ? inferSchema(example[0], descMap) : { type: 'string' } };
                  }
                  if (typeof example === 'object') {
                    const properties = {};
                    for (const key in example) {
                      properties[key] = inferSchema(example[key], descMap);
                      // Injeta a descrição resgatada se existir
                      if (descMap && descMap[key]) {
                        properties[key].description = descMap[key];
                      }
                    }
                    return { type: 'object', properties };
                  }
                  return { type: typeof example };
                }
                
                if (openapi.paths) {
                  for (const path in openapi.paths) {
                    for (const method in openapi.paths[path]) {
                      const operation = openapi.paths[path][method];
                      
                      // Usa o nome da rota (summary) para achar os comentários salvos
                      const descMap = endpointDescriptions[operation.summary] || {};
                      
                      if (operation.requestBody && operation.requestBody.content && operation.requestBody.content['application/json']) {
                        const content = operation.requestBody.content['application/json'];
                        let exampleData = content.example;
                        if (exampleData === undefined && content.schema && content.schema.example !== undefined) {
                          exampleData = content.schema.example;
                        }
                        
                        if (exampleData && typeof exampleData === 'object' && Object.keys(exampleData).length > 0) {
                          const inferred = inferSchema(exampleData, descMap);
                          if (!content.schema) content.schema = {};
                          content.schema.type = inferred.type;
                          content.schema.properties = inferred.properties;
                          if (inferred.items) content.schema.items = inferred.items;
                        }
                      }
                    }
                  }
                }
                
                fs.writeFileSync('./openapi.yaml', yaml.dump(openapi, { lineWidth: -1 }));
                fs.unlinkSync(tempFile);
                console.log('Conversão 100% concluída! Comentários mapeados para o GitBook!');
              })
              .catch(err => {
                console.error('Erro na conversão:', err);
                process.exit(1);
              });
              
          } catch(err) {
            console.error('Erro geral:', err);
            process.exit(1);
          }
          "
          
      - name: Salvar o YAML no GitHub
        run: |
          git config --global user.name "Robô de Conversão"
          git config --global user.email "action@github.com"
          git add openapi.yaml
          git commit -m "Auto-convertendo e Injetando Descrições GitBook" || exit 0
          git push
