openapi: 3.0.3
info:
  title: Z-PRO — API Externa
  version: v4.x.x.x
  description: |-
    API externa do Z-PRO (plataforma omnichannel da ZDG).

    Spec gerado a partir da coleção Postman oficial `Z-PRO v4.x.x.x`.

    **Autenticação:** todas as rotas usam Bearer Token. As rotas de tenant (criação de API/tenant) exigem token de super admin.

    **Base URL:** informe o domínio do seu backend Z-PRO na variável `baseUrl` do servidor (ex.: `api.seudominio.com.br`).

    Os exemplos de corpo vieram da coleção Postman; campos marcados como obrigatórios refletem os comentários da coleção original. Valores no formato `{{algumaCoisa}}` nos exemplos são placeholders: troque pelo valor real antes de enviar.
servers:
- url: https://{baseUrl}
  description: Instalação Z-PRO do cliente
  variables:
    baseUrl:
      default: api.seudominio.com.br
      description: Domínio do backend Z-PRO, sem protocolo e sem barra final.
tags:
- name: 📅 Agendamentos e Lembretes
- name: 📣 Campanhas
- name: 🔌 Canais e Sessões
- name: 👤 Contatos
- name: 🏗️ CRM - Pipeline
- name: 📊 Dashboard
- name: 📤 Envio em Lote
- name: 🎯 Envio por Ticket
- name: 📂 Galeria
- name: 👥 Grupos WhatsApp
- name: 🟢 Interativo Baileys
- name: 🟢 Interativo Zapo
- name: 📷 Interativo Instagram
- name: 💬 Interativo Messenger
- name: 🟩 Interativo UazAPI
- name: 🔘 Interativo Waba
- name: 🏷️ Kanban / Tags / Motivos / Filas
- name: 📊 Listagens
- name: 🔍 Listagens Utilitárias
- name: 📞 Logs de Chamadas
- name: 📨 Mensagens
- name: 📨 Mensagens Avançadas
- name: 👥 Mensagens em Grupo
- name: 💼 Oportunidades
- name: 📋 Templates WABA
- name: 🏢 Tenant API
- name: 🎫 Tickets
- name: 🎫 Tickets - Extras
- name: ✅ To-Do List
- name: 👥 Usuários
security:
- bearerAuth: []
paths:
  /v2/api/external/{apiId}/appointment/create:
    post:
      tags:
      - 📅 Agendamentos e Lembretes
      summary: AppointmentCreate
      operationId: AppointmentCreate
      parameters:
      - $ref: '#/components/parameters/ApiId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Reunião de Vendas
                description:
                  type: string
                  example: Reunião sobre proposta comercial
                contactId:
                  type: string
                  example: '{{contactId}}'
                contactName:
                  type: string
                  example: João Silva
                contactPhone:
                  type: string
                  example: '5511999999999'
                whatsappId:
                  type: string
                  example: '{{whatsappId}}'
                startAt:
                  type: string
                  example: '2026-04-15T14:00:00.000Z'
                endAt:
                  type: string
                  example: '2026-04-15T15:00:00.000Z'
                status:
                  type: string
                  example: pending
                notes:
                  type: string
                  example: Levar proposta impressa
            example:
              title: Reunião de Vendas
              description: Reunião sobre proposta comercial
              contactId: '{{contactId}}'
              contactName: João Silva
              contactPhone: '5511999999999'
              whatsappId: '{{whatsappId}}'
              startAt: '2026-04-15T14:00:00.000Z'
              endAt: '2026-04-15T15:00:00.000Z'
              status: pending
              notes: Levar proposta impressa
      responses:
        '200':
          description: Requisição processada com sucesso.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Token ausente, inválido ou sem permissão.
        '400':
          description: Parâmetros inválidos ou faltando.
      security:
      - bearerAuth: []
