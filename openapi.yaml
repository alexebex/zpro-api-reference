                  example: '10'
                  description: ID do fluxo de chat (opcional)
                queueId:
                  type: string
                  example: '1'
                  description: ID da fila (opcional)
                channelId:
                  type: string
                  description: 'ID do canal (opcional). Para webmail: envie o id do canal webmail'
                email:
                  type: string
                  description: 'Para canal webmail: email do contato (obrigatório quando usar channelId
