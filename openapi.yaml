              - evo
              - evogo
              - zapi
              - uazapi
              - zapo
              - telegram
              - hub
              - webchat
              - mercadolivre
              - olx
              - linkedin
              - youtube
              - tiktok
              - woocommerce
              - nuvemshop
              - webmail
              - email
              - waba_oauth
              - dialog360
              - gupshup
              - instagram_oauth
              - facebook_oauth
              channelConnectionLimits:
                waba: 0
                waba_oauth: 0
                instagram_oauth: 0
                facebook_oauth: 0
                hub: 0
                baileys: 0
                zapo: 0
                telegram: 0
                webchat: 0
                webmail: 0
