      summary: SendMessageAPI
      operationId: SendMessageAPIFile
      parameters:
      - $ref: '#/components/parameters/ApiId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                media:
                  type: string
                  format: binary
                  description: Arquivo a ser enviado (imagem, documento, etc)
                body:
                  type: string
                  example: Mensagem de teste 2
                  description: Texto da mensagem que acompanhará o arquivo
                number:
                  type: string
                  example: '5515998566622'
                  description: 'Número do WhatsApp do destinatário (formato: 5511999999999)'
                externalKey:
                  type: string
                  example: ID_UNICA_DO_SISTEMA_CLIENTE_PARA_EXECUTAR_UMA_ACAO_COM_WEBHOOK
                  description: Chave única do sistema para identificação (valor gerado do seu lado para
                    controle do envio e não pode se repetir)
                isClosed:
                  type: string
                  example: 'false'
                  description: Define se o ticket será fechado após o envio
                validateNumber:
                  type: string
                  example: 'true'
                  description: Validar numero (opcional, padrao true). Se false, usa o numero exatamente
                    como enviado, sem normalizacao do 9o digito BR (recomendado p/ WABA).
              required:
              - media
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: Texto da mensagem que será enviada
                  example: A mensagem desejada
                number:
                  type: string
                  description: 'Número do WhatsApp do destinatário (formato: 5511999999999)'
                  example: '5515998566622'
                externalKey:
                  type: string
                  description: Chave única do sistema para identificação (valor gerado do seu lado para
                    controle do envio e não pode se repetir)
                  example: ID_UNICA_DO_SISTEMA_CLIENTE_PARA_EXECUTAR_UMA_ACAO_COM_WEBHOOK
                isClosed:
                  type: boolean
                  description: Define se o ticket será fechado após o envio
                  example: false
                validateNumber:
                  type: boolean
                  description: Validar numero (opcional, padrao true). Se false, usa o numero exatamente
                    como enviado, sem normalizacao do 9o digito BR — recomendado p/ WABA evitar ticket
                    duplicado
                  example: true
            examples:
              SendMessageAPIText:
                summary: SendMessageAPIText
                value:
                  body: A mensagem desejada
                  number: '5515998566622'
                  externalKey: ID_UNICA_DO_SISTEMA_CLIENTE_PARA_EXECUTAR_UMA_ACAO_COM_WEBHOOK
                  isClosed: false
                  validateNumber: true
      responses:
        '200':
          description: Requisição processada com sucesso.
          content:
            application/json:
              schema:
                type: object
        '401':
