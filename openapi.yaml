        - 📅 Agendamentos e Lembretes
      summary: AppointmentCreate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                title: Reunião de Vendas
                description: Reunião sobre proposta comercial
                contactId: '{{contactId}}'
                contactName: João Silva
                contactPhone: '5511999999999'
                whatsappId: '{{whatsappId}}'
                startAt: '2026-04-15T14:00:00.000Z'
                endAt: '2026-04-15T15:00:00.000Z'
                status: pending
                notes: Levar proposta impressa
              properties:
                title:
                  type: string
                description:
                  type: string
                contactId:
                  type: string
                contactName:
                  type: string
                contactPhone:
                  type: string
                whatsappId:
                  type: string
                startAt:
                  type: string
                endAt:
                  type: string
                status:
                  type: string
                notes:
                  type: string
      parameters:
        - name: ApiID
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
