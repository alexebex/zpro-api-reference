                body:
                  type: string
                  example: Mensagem de teste 2
                  description: Texto da mensagem inicial do ticket
                number:
                  type: string
                  example: '5515998566622'
                  description: 'Número do WhatsApp do contato (formato: 5511999999999)'
                externalKey:
